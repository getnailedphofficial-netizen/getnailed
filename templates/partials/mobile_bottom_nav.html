<style>
  .gn-mobile-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1030;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(139, 61, 82, 0.14);
    box-shadow: 0 -6px 24px rgba(45, 20, 28, 0.08);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .gn-mobile-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    color: #5c464d;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: 12px;
    transition: all 0.2s ease;
  }
  .gn-mobile-nav-item i {
    font-size: 1.2rem;
    line-height: 1;
  }
  .gn-mobile-nav-item:hover,
  .gn-mobile-nav-item.active {
    color: #8b3d52;
    background: rgba(139, 61, 82, 0.08);
  }
  .gn-mobile-nav-cta {
    background: linear-gradient(135deg, #8b3d52 0%, #6d2b3d 100%);
    color: #ffffff !important;
    box-shadow: 0 4px 12px rgba(139, 61, 82, 0.28);
  }
  .gn-mobile-nav-cta:hover {
    background: linear-gradient(135deg, #7a3346 0%, #5c2232 100%);
    color: #ffffff !important;
  }
  @media (max-width: 991.98px) {
    body {
      padding-bottom: 74px;
    }
  }
</style>

<nav class="gn-mobile-bottom-nav d-lg-none" aria-label="Mobile quick navigation">
  <div class="d-flex align-items-center justify-content-around gap-1">
    {% if user.is_authenticated %}
      {% if user.is_customer %}
        <a href="{% url 'core:customer_dashboard' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'customer_dashboard' %}active{% endif %}">
          <i class="bi bi-house-door"></i>
          <span>Home</span>
        </a>
        <a href="{% url 'core:customer_services' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'customer_services' %}active{% endif %}">
          <i class="bi bi-stars"></i>
          <span>Services</span>
        </a>
        <a href="{% url 'bookings:index' %}" class="gn-mobile-nav-item gn-mobile-nav-cta">
          <i class="bi bi-calendar-plus"></i>
          <span>Book</span>
        </a>
        <a href="{% url 'core:customer_appointments' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'customer_appointments' %}active{% endif %}">
          <i class="bi bi-calendar-check"></i>
          <span>Bookings</span>
        </a>
        <a href="{% url 'core:customer_profile' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'customer_profile' %}active{% endif %}">
          <i class="bi bi-person"></i>
          <span>Profile</span>
        </a>
      {% elif user.is_owner or user.is_cashier %}
        <a href="{% url 'core:dashboard_router' %}" class="gn-mobile-nav-item {% if 'dashboard' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-speedometer2"></i>
          <span>Home</span>
        </a>
        <a href="{% url 'bookings:manage' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'manage' %}active{% endif %}">
          <i class="bi bi-calendar2-check"></i>
          <span>Bookings</span>
        </a>
        <a href="{% url 'pos:index' %}" class="gn-mobile-nav-item gn-mobile-nav-cta">
          <i class="bi bi-cart3"></i>
          <span>POS</span>
        </a>
        <a href="{% url 'monitoring:index' %}" class="gn-mobile-nav-item {% if request.resolver_match.app_name == 'monitoring' %}active{% endif %}">
          <i class="bi bi-kanban"></i>
          <span>Board</span>
        </a>
      {% else %}
        <a href="{% url 'core:staff_dashboard' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'staff_dashboard' %}active{% endif %}">
          <i class="bi bi-house-door"></i>
          <span>Home</span>
        </a>
        <a href="{% url 'bookings:assigned' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'assigned' %}active{% endif %}">
          <i class="bi bi-calendar-check"></i>
          <span>My Work</span>
        </a>
        <a href="{% url 'monitoring:index' %}" class="gn-mobile-nav-item gn-mobile-nav-cta">
          <i class="bi bi-kanban"></i>
          <span>Board</span>
        </a>
        <a href="{% url 'services:schedule_list' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'schedule_list' %}active{% endif %}">
          <i class="bi bi-calendar3-range"></i>
          <span>Schedule</span>
        </a>
      {% endif %}
    {% else %}
      <a href="{% url 'core:home' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        <i class="bi bi-house-door"></i>
        <span>Home</span>
      </a>
      <a href="{% url 'bookings:index' %}" class="gn-mobile-nav-item gn-mobile-nav-cta">
        <i class="bi bi-calendar-plus"></i>
        <span>Book Now</span>
      </a>
      <a href="{% url 'bookings:status_lookup' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'status_lookup' %}active{% endif %}">
        <i class="bi bi-search"></i>
        <span>Status</span>
      </a>
      <a href="{% url 'accounts:login' %}" class="gn-mobile-nav-item {% if request.resolver_match.url_name == 'login' %}active{% endif %}">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Sign In</span>
      </a>
    {% endif %}
  </div>
</nav>
